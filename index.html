<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">
    <div class="container1">

        <img src="https://i.pinimg.com/736x/0d/a6/96/0da696c0fc582ba2a3abe7ea6f423ddd.jpg"
             alt="Login Image" class="logo">

        <h1 class="text">Hello</h1>
        <h2 class="text">
            <span>Welcome</span> Back <br> Login to your world
        </h2>

        <form>
            <input type="email" id="email" placeholder="Email or phone number" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" id="submit">Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="./register.html">Register</a>
        </p>

    </div>
</div>
<script type="module" src="./login.js"></script>
</body>
</html>
