
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">
    <div class="container1">

        <img src="https://i.pinimg.com/736x/0d/a6/96/0da696c0fc582ba2a3abe7ea6f423ddd.jpg"
             alt="Login Image" class="logo">

        <h1 class="text">Register Here</h1>
        

        <form>
            <input type="text" placeholder="First Name" required>
            <input type="text" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email or phone number" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" id="submit">Register</button>
        </form>

        <p>
            Already have account?
            <a href="./index.html">Login</a>
        </p>

    </div>
</div>


<script type="module" src="register.js"></script>
</body>
</html>
